services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory_nexus
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset-redis:
    image: redis:7-alpine
    volumes:
      - superset-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:inventory@postgres:5432/inventory_nexus
      SECRET_KEY: replace-this-in-prod
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SUPERSET_BASE_URL: http://superset:8088
      SUPERSET_USERNAME: admin
      SUPERSET_PASSWORD: admin
      SUPERSET_DASHBOARD_ID: ""
    volumes:
      - ./Multi source Customer Mart for Female Recommendati:/data/customer-mart:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_SUPERSET_DOMAIN: http://localhost:8088
      VITE_SUPERSET_DASHBOARD_ID: ""
    ports:
      - "5173:5173"
    depends_on:
      - backend

  superset-init:
    build:
      context: ./infra/superset
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: replace-this-superset-secret-in-prod
      SUPERSET_METADATA_DATABASE_URI: postgresql://superset:superset@superset-db:5432/superset
      SUPERSET_ADMIN_USERNAME: admin
      SUPERSET_ADMIN_EMAIL: admin@inventory-nexus.example.com
      SUPERSET_ADMIN_PASSWORD: admin
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./infra/superset/bootstrap.sh:/app/bootstrap.sh:ro
    command: ["/app/bootstrap.sh"]
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy

  superset:
    build:
      context: ./infra/superset
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: replace-this-superset-secret-in-prod
      SUPERSET_METADATA_DATABASE_URI: postgresql://superset:superset@superset-db:5432/superset
      SUPERSET_GUEST_TOKEN_JWT_SECRET: replace-this-guest-token-secret-in-prod
      REDIS_HOST: superset-redis
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  superset-db-data:
  superset-redis-data:
